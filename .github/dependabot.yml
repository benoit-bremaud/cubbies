# Dependabot — keeps the SHA-pinned GitHub Actions in .github/workflows current.
# Each bump PR carries the new SHA and refreshes the trailing "# vX.Y.Z" comment.
# PlatformIO platform and libraries are pinned by hand in firmware/platformio.ini (no ecosystem),
# and so is the PlatformIO core version in the workflows' `pip install` lines
# and the ruff `version:` input of the ci.yml python job.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # Supply chain: never propose a release younger than a week.
    cooldown:
      default-days: 7
    # CodeQL's init and analyze must run the same version (upload-sarif kept in step): bump them in one PR.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
    commit-message:
      prefix: 'chore(deps)'
