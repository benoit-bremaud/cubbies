# Gitleaks configuration — cubbies
# Extends the default rule set shipped with the gitleaks binary (v8):
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "cubbies gitleaks config"

[extend]
useDefault = true

# Requires gitleaks >= 8.25.0 (CI pins 8.30.1 in .github/workflows/gitleaks.yml).
# Paths only, for files that trigger rules on every scan: this config is listed because its own
# comments and example patterns can match the default rules. For a single reviewed false
# positive, add the finding's fingerprint to a `.gitleaksignore` file at the repository root
# instead (one `<commit-sha>:<file-path>:<rule-id>:<line-number>` per line), justified in the
# PR that adds it.
[[allowlists]]
description = "Reviewed false positives (paths only; prefer .gitleaksignore)"
paths = [
  '''\.gitleaks\.toml$''',
]
