; cubbies firmware — PlatformIO project (ADR-0004)
;
; Platform: pioarduino (community espressif32 platform shipping Arduino core 3.3.x on
; ESP-IDF 5.5), pinned to a release archive. Never float this URL or a lib_deps entry.
; Envs:
;   xiao_c3      Seeed XIAO ESP32-C3, the series board (ADR-0003)
;   c3_supermini ESP32-C3 Super Mini, prototypes only (no charger)
;   native       host build of firmware/lib/ for unit tests (pio test -e native)

[platformio]
default_envs = xiao_c3
src_dir = src
lib_dir = lib
test_dir = test
include_dir = include

[env]
build_flags = -Wall -Wextra -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =

[esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=2

[env:xiao_c3]
extends = esp32c3
board = seeed_xiao_esp32c3
build_flags =
  ${esp32c3.build_flags}
  -DCUBBIES_BOARD_XIAO_C3=1

[env:c3_supermini]
extends = esp32c3
board = esp32-c3-devkitm-1
build_flags =
  ${esp32c3.build_flags}
  -DARDUINO_USB_MODE=1
  -DCUBBIES_BOARD_C3_SUPERMINI=1

[env:native]
platform = native
build_flags =
  ${env.build_flags}
  -DCUBBIES_NATIVE=1
test_framework = unity
