# Local CI toolchain (#99, skill local-ci): every CLI the justfile tiers and the lefthook hooks call,
# pinned; `mise.lock` pins the checksums. `just setup` installs it. Python tools run through `uvx`
# with their version in the justfile (PlatformIO 6.2.0, ruff 0.14.0, Semgrep): a mise pipx install
# would need a mise-managed Python. System tools stay outside mise: python3, sonar-scanner (not in
# the mise registry, skill infra-accounts), kicad-cli, ngspice and freecadcmd (tools/sonar-scan.sh).
# TLS behind the Aikido endpoint agent is handled by its system-wide UV_SYSTEM_CERTS and
# REQUESTS_CA_BUNDLE (skill aikido-device-protection): never override them here, uv then fails
# with "invalid peer certificate" inside the PlatformIO penv setup.
[tools]
uv = "0.13.7"            # `uvx --from platformio==… pio`, `uvx ruff@…`, `uvx semgrep@…`
just = "1.59.0"
lefthook = "2.2.2"
typos = "1.52.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trufflehog = "3.99.8"

[env]
# PlatformIO packages of this project only. The shared ~/.platformio/packages holds one directory per
# package name, and the official espressif32 platform of another project on this machine pins
# toolchain-riscv32-esp 8.4.0 where pioarduino pins 14.2.0: each build of one project reinstalled
# the toolchain of the other, and a build in between found no riscv32-esp-elf-g++ (ADR-0019). The
# platform, the penv and the download cache stay shared under ~/.platformio.
PLATFORMIO_PACKAGES_DIR = "{{env.HOME}}/.platformio/packages-cubbies"

[settings]
lockfile = true
