# SonarQube scan settings: run `sh hardware/electronics/sim/run.sh`,
# `sh hardware/electronics/sim/coverage.sh`, then `sonar-scanner` from the repository root.
sonar.projectKey=cubbies
sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.exclusions=hardware/electronics/sim/test_*.py,.claude/**
sonar.tests=hardware/electronics/sim
sonar.test.inclusions=hardware/electronics/sim/test_*.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=hardware/electronics/sim/coverage.xml
# Scripts that only run inside FreeCAD (the case) or as a manual review tool (the golden
# sheet): their checks are the FreeCAD PASS lines and the PR review of the sheet, not unit tests.
sonar.coverage.exclusions=hardware/case/cubbies_case.py,firmware/tools/golden_sheet.py
