# Local SonarQube analysis (self-hosted Community Build, main only). Run tools/sonar-scan.sh;
# the token comes from SONAR_TOKEN in the environment, never from this file.
sonar.projectKey=cubbies
sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test_*.py
sonar.exclusions=**/test_*.py,firmware/.pio/**
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
