# typos configuration (#99, `just lint` and the pre-commit hook). Everything written here is
# English; the exclusions are generated, binary or third-party content.
[files]
extend-exclude = [
  ".claude/",
  "firmware/.pio/",
  "hardware/electronics/sim/results/",
  "hardware/electronics/sim/*.lib",
  "hardware/electronics/*.kicad_*",
  "hardware/case/exports/",
  "*.lock",
  "*.png",
  "*.svg",
  "*.stl",
  "*.3mf",
  "*.step",
]

[default]
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b", # commit SHAs and digests
  "rror\\|atal", # grep pattern of hardware/electronics/sim/run.sh (E/error, F/fatal)
]

[default.extend-identifiers]
PNGs = "PNGs"
certifi = "certifi" # the Python CA bundle package (scripts/pio-trust-local-ca.sh)
AFE = "AFE" # Espressif Audio Front End (docs/research/voice-and-ai.md)

[default.extend-words]
driveable = "driveable" # accepted spelling, kept as written in ADR-0010
